<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title"><title id="title">ソファ横の1と奥の棚の2。家具とラグを配置し、右側に通り道を空けた上面図</title><defs><radialGradient id="halo"><stop stop-color="#D6A860" stop-opacity=".55"/><stop offset="1" stop-color="#D6A860" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="900" fill="#17110D"/><text x="65" y="95" fill="#EDE3D3" font-size="52" font-weight="700" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">② 奥が暗ければ、棚にも置く</text><text x="65" y="170" fill="#C4B29A" font-size="34" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">部屋を上から見た例　／　丸印は灯りの位置</text><rect x="95" y="230" width="1010" height="470" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><rect x="180" y="265" width="615" height="92" rx="8" fill="#4F3926" stroke="#9A7752" stroke-width="3"/><text x="215" y="326" fill="#EDE3D3" font-size="40" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">奥の棚</text><circle cx="720" cy="310" r="70" fill="url(#halo)"/><circle cx="720" cy="310" r="30" fill="#D6A860" stroke="#EDE3D3" stroke-width="3"/><text x="707" y="325" fill="#17110D" font-size="42" font-weight="700" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">2</text><rect x="170" y="390" width="665" height="255" rx="28" fill="#342A21" stroke="#4C3B2A" stroke-width="3"/><g transform="translate(210 440) scale(1.05 1.0526315789473684)"><rect x="0" y="0" width="400" height="185" rx="20" fill="#594431" stroke="#A88E6E" stroke-width="3"/><rect x="28" y="8" width="344" height="40" rx="12" fill="#80694F" stroke="#A88E6E" stroke-width="3"/><rect x="38" y="56" width="157" height="112" rx="14" fill="#80694F" stroke="#A88E6E" stroke-width="3"/><rect x="205" y="56" width="157" height="112" rx="14" fill="#80694F" stroke="#A88E6E" stroke-width="3"/><rect x="0" y="40" width="30" height="145" rx="12" fill="#594431" stroke="#A88E6E" stroke-width="3