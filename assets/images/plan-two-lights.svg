<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">上から見た配置｜横の台と、離れた棚</title><desc id="desc">ソファ横と離れた棚に灯りを分け、通り道を空ける配置の例</desc><defs><radialGradient id="glow"><stop offset="0" stop-color="#d6a860" stop-opacity=".5"/><stop offset="1" stop-color="#d6a860" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" fill="#1c1510"/><text x="55" y="66" fill="#ede3d3" font-size="27" font-family="sans-serif">上から見た配置｜横の台と、離れた棚</text><line x1="55" y1="92" x2="1145" y2="92" stroke="#5c4631"/><rect x="240" y="130" width="700" height="390" rx="6" fill="none" stroke="#907456" stroke-width="2"/><rect x="300" y="340" width="260" height="105" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><text x="374" y="399" fill="#ede3d3" font-size="23" font-family="sans-serif">座る場所</text><rect x="300" y="150" width="220" height="70" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><rect x="590" y="340" width="80" height="80" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><circle cx="631" cy="380" r="80" fill="url(#glow)"/><circle cx="631" cy="380" r="11" fill="#d6a860"/><circle cx="480" cy="183" r="50" fill="url(#glow)"/><circle cx="480" cy="183" r="11" fill="#d6a860"/><text x="354" y="195" fill="#ede3d3" font-size="20" font-family="sans-serif">奥の棚</text><path d="M880 520 L880 280 L755 280 L755 460" fill="none" stroke="#9c8b73" stroke-width="4" stroke-dasharray="10 10"/><text x="760" y="475" fill="#ede3d3" font-size="20" font-family="sans-serif">通り道</text><text x="955" y="390" fill="#ede3d3" font-size="20" font-family="sans-serif">横の灯り</text><text x="60" y="195" fill="#ede3d3" font-size="20" font-family="sans-serif">奥の灯り</text><path d="M950 382 L670 382 M168 187 L300 187" stroke="#d6a860" stroke-width="2"/><text x="55" y="595" fill="#bba78e" font-size="17" font-family="sans-serif">配置の説明図です。商品の形・寸法・実際の明るさを示すものではありません。</text></svg>