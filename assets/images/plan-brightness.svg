<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title"><title id="title">手元の飲み物と本、歩く足元を確認。暗ければ天井の照明を使う</title><defs><radialGradient id="halo"><stop stop-color="#D6A860" stop-opacity=".55"/><stop offset="1" stop-color="#D6A860" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="900" fill="#17110D"/><text x="65" y="95" fill="#EDE3D3" font-size="52" font-weight="700" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">③ 手元と足元が見えるか確認</text><text x="65" y="170" fill="#C4B29A" font-size="40" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">暗ければ、天井の照明も使います。</text><rect x="65" y="235" width="515" height="390" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><rect x="620" y="235" width="515" height="390" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><text x="110" y="310" fill="#D6A860" font-size="48" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">手元</text><path d="M125 435 H510" fill="none" stroke="#AA8D67" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="150" y="345" width="90" height="80" rx="10" fill="#49382A" stroke="#EDE3D3" stroke-width="3"/><path d="M240 360 C290 350 290 410 240 405" fill="none" stroke="#EDE3D3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M335 360 L405 378 L405 440 L335 422 Z M405 378 L475 360 L475 422 L405 440" fill="none" stroke="#EDE3D3" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="110" y="545" fill="#EDE3D3" font-size="38" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">飲み物・本が見える</text><text x="665" y="310" fill="#D6A860" font-size="48" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">足元</text><rect x="935" y="345" width="100" height="120" rx="3" fill="#49382A" stroke="#AA8D67" stroke-width="3"/><circle cx="1015" cy="407" r="5" fill="#D6A860"/><path d="M675 468 H1080" fill="none" stroke="#AA8D67" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M715 430 H865 L902 390 M883 391 L902 390 L898 409" fill="none" stroke="#D6A860" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><text x="665" y="545" fill="#EDE3D3" font-size="38" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">通り道が見える</text><rect x="65" y="685" width="1070" height="135" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><text x="105" y="770" fill="#EDE3D3" font-size="44" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">まぶしいときは、灯りを横へずらす。</text></svg>