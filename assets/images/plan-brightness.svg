<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">明るさは、することに合わせて確かめる</title><desc id="desc">座る場所、読書の手元、歩く足元を個別に確認する図</desc><defs><radialGradient id="glow"><stop offset="0" stop-color="#d6a860" stop-opacity=".5"/><stop offset="1" stop-color="#d6a860" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" fill="#1c1510"/><text x="55" y="66" fill="#ede3d3" font-size="27" font-family="sans-serif">明るさは、することに合わせて確かめる</text><line x1="55" y1="92" x2="1145" y2="92" stroke="#5c4631"/><rect x="65" y="145" width="1070" height="360" rx="6" fill="none" stroke="#5c4631" stroke-width="2"/><circle cx="225" cy="230" r="70" fill="url(#glow)"/><circle cx="225" cy="230" r="11" fill="#d6a860"/><text x="100" y="345" fill="#ede3d3" font-size="28" font-family="sans-serif">座る場所</text><text x="100" y="400" fill="#ede3d3" font-size="20" font-family="sans-serif">光源が目に入り続けないか</text><text x="100" y="438" fill="#ede3d3" font-size="20" font-family="sans-serif">飲み物の場所が分かるか</text><circle cx="580" cy="230" r="70" fill="url(#glow)"/><circle cx="580" cy="230" r="11" fill="#d6a860"/><text x="455" y="345" fill="#ede3d3" font-size="28" font-family="sans-serif">読む手元</text><text x="455" y="400" fill="#ede3d3" font-size="20" font-family="sans-serif">文字を無理なく追えるか</text><text x="455" y="438" fill="#ede3d3" font-size="20" font-family="sans-serif">足りなければ手元に灯りを</text><circle cx="935" cy="230" r="70" fill="url(#glow)"/><circle cx="935" cy="230" r="11" fill="#d6a860"/><text x="810" y="345" fill="#ede3d3" font-size="28" font-family="sans-serif">歩く足元</text><text x="810" y="400" fill="#ede3d3" font-size="20" font-family="sans-serif">床の物や段差が見えるか</text><text x="810" y="438" fill="#ede3d3" font-size="20" font-family="sans-serif">暗ければ天井の照明も使う</text><text x="55" y="595" fill="#bba78e" font-size="17" font-family="sans-serif">配置の説明図です。商品の形・寸法・実際の明るさを示すものではありません。</text></svg>