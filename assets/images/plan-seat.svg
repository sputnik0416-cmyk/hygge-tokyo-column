<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">横から見た配置｜普段の姿勢で確かめる</title><desc id="desc">ソファ、ベッド、床座りそれぞれの横に安定した台を置く模式図。人や製品は描かない</desc><defs><radialGradient id="glow"><stop offset="0" stop-color="#d6a860" stop-opacity=".5"/><stop offset="1" stop-color="#d6a860" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" fill="#1c1510"/><text x="55" y="66" fill="#ede3d3" font-size="27" font-family="sans-serif">横から見た配置｜普段の姿勢で確かめる</text><line x1="55" y1="92" x2="1145" y2="92" stroke="#5c4631"/><text x="65" y="145" fill="#ede3d3" font-size="25" font-family="sans-serif">ソファ</text><rect x="65" y="330" width="185" height="70" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><rect x="285" y="295" width="90" height="20" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><path d="M295 315 V490 M365 315 V490 M65 490 H385" stroke="#907456" stroke-width="3"/><circle cx="325" cy="265" r="78" fill="url(#glow)"/><circle cx="325" cy="265" r="11" fill="#d6a860"/><text x="65" y="540" fill="#ede3d3" font-size="18" font-family="sans-serif">安定した台で、まぶしさを確認</text><text x="450" y="145" fill="#ede3d3" font-size="25" font-family="sans-serif">ベッド</text><rect x="450" y="350" width="185" height="70" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><rect x="670" y="315" width="90" height="20" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><path d="M680 335 V490 M750 335 V490 M450 490 H770" stroke="#907456" stroke-width="3"/><circle cx="710" cy="285" r="78" fill="url(#glow)"/><circle cx="710" cy="285" r="11" fill="#d6a860"/><text x="450" y="540" fill="#ede3d3" font-size="18" font-family="sans-serif">安定した台で、まぶしさを確認</text><text x="835" y="145" fill="#ede3d3" font-size="25" font-family="sans-serif">床座り</text><rect x="835" y="430" width="185" height="70" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><rect x="1055" y="395" width="90" height="20" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><path d="M1065 415 V490 M1135 415 V490 M835 490 H1155" stroke="#907456" stroke-width="3"/><circle cx="1095" cy="365" r="78" fill="url(#glow)"/><circle cx="1095" cy="365" r="11" fill="#d6a860"/><text x="835" y="540" fill="#ede3d3" font-size="18" font-family="sans-serif">安定した台で、まぶしさを確認</text><text x="55" y="595" fill="#bba78e" font-size="17" font-family="sans-serif">配置の説明図です。商品の形・寸法・実際の明るさを示すものではありません。</text></svg>