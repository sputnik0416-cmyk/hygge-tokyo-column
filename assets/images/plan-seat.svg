<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title"><title id="title">ソファの横にサイドテーブルと一般的なランプの記号を配置した例</title><defs><radialGradient id="halo"><stop stop-color="#D6A860" stop-opacity=".55"/><stop offset="1" stop-color="#D6A860" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="900" fill="#17110D"/><text x="65" y="95" fill="#EDE3D3" font-size="56" font-weight="700" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">① 座る場所の横に置く</text><text x="65" y="170" fill="#C4B29A" font-size="38" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">ソファ横の台から、置き場所を試します。</text><rect x="80" y="225" width="1040" height="390" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><path d="M82 530 H1118" fill="none" stroke="#6D533C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="570" cy="558" rx="420" ry="35" fill="#3B3025"/><g transform="translate(160 355) scale(1.175 1.1578947368421053)"><ellipse cx="200" cy="183" rx="200" ry="16" fill="#100C09" opacity=".5"/><rect x="28" y="150" width="18" height="34" rx="3" fill="#9A7952" stroke="none" stroke-width="3"/><rect x="354" y="150" width="18" height="34" rx="3" fill="#9A7952" stroke="none" stroke-width="3"/><rect x="15" y="10" width="370" height="150" rx="22" fill="#68533F" stroke="#9D8263" stroke-width="3"/><rect x="42" y="22" width="153" height="87" rx="15" fill="#80694F" stroke="#A88E6E" stroke-width="3"/><rect x="205" y="22" width="153" height="87" rx="15" fill="#80694F" stroke="#A88E6E" stroke-width="3"/><rect x="42" y="115" width="153" height="42" rx="11" fill="#6E5842" stroke="#A88E6E" stroke-width="3"/><rect x="205" y="115" width="153" height="42" rx="11" fill="#6E5842" stroke="#A88E6E" stroke-width="3"/><rect x="0" y="75" width="36" height="96" rx="13" fill="#594431" stroke="#A88E6E" stroke-width="3"/><rect x="364" y="75" width="36" height="96" rx="13" fill="#594431" stroke="#A88E6E" stroke-width="3"/><rect x="60" y="46" width="60" height="58" rx="10" fill="#B5A084" transform="rotate(-9 90 75)"/></g><path d="M808 471 V575 M962 471 V575" fill="none" stroke="#9C7952" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/><rect x="790" y="455" width="190" height="22" rx="8" fill="#695039" stroke="#BB9565" stroke-width="3"/><ellipse cx="885" cy="396" rx="105" ry="110" fill="url(#halo)"/><path d="M885 387 V444" fill="none" stroke="#D6A860" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><rect x="853" y="442" width="64" height="10" rx="5" fill="#D6A860" stroke="none" stroke-width="3"/><path d="M857 342 H913 L932 392 H838 Z" fill="#DCC39A" stroke="#EDE3D3" stroke-width="3"/><text x="750" y="300" fill="#D6A860" font-size="38" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">灯りは横の台へ</text><path d="M1030 320 V430 L995 430 M1010 417 L995 430 L1010 443" fill="none" stroke="#D6A860" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="665" width="1070" height="150" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><text x="105" y="725" fill="#EDE3D3" font-size="44" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">いつもの姿勢で、まぶしさを確認。</text><text x="105" y="780" fill="#C4B29A" font-size="36" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">ベッドや床座りも、横の安定した台へ。</text></svg>