<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">今夜、手持ちの灯りで試す順番</title><desc id="desc">横に置く、奥を確かめる、手元を見る、足元を見る、の順番を矢印で示す</desc><defs><radialGradient id="glow"><stop offset="0" stop-color="#d6a860" stop-opacity=".5"/><stop offset="1" stop-color="#d6a860" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="630" fill="#1c1510"/><text x="55" y="66" fill="#ede3d3" font-size="27" font-family="sans-serif">今夜、手持ちの灯りで試す順番</text><line x1="55" y1="92" x2="1145" y2="92" stroke="#5c4631"/><rect x="65" y="185" width="215" height="250" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><circle cx="170" cy="265" r="60" fill="url(#glow)"/><circle cx="170" cy="265" r="11" fill="#d6a860"/><text x="89" y="365" fill="#ede3d3" font-size="24" font-family="sans-serif">横に置く</text><path d="M300 310 h30 l-9 -9 m9 9 l-9 9" stroke="#d6a860" fill="none" stroke-width="3"/><rect x="350" y="185" width="215" height="250" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><circle cx="455" cy="265" r="60" fill="url(#glow)"/><circle cx="455" cy="265" r="11" fill="#d6a860"/><text x="374" y="365" fill="#ede3d3" font-size="24" font-family="sans-serif">奥を確かめる</text><path d="M585 310 h30 l-9 -9 m9 9 l-9 9" stroke="#d6a860" fill="none" stroke-width="3"/><rect x="635" y="185" width="215" height="250" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><circle cx="740" cy="265" r="60" fill="url(#glow)"/><circle cx="740" cy="265" r="11" fill="#d6a860"/><text x="659" y="365" fill="#ede3d3" font-size="24" font-family="sans-serif">手元を見る</text><path d="M870 310 h30 l-9 -9 m9 9 l-9 9" stroke="#d6a860" fill="none" stroke-width="3"/><rect x="920" y="185" width="215" height="250" rx="6" fill="#3b2c20" stroke="#8b7155" stroke-width="2"/><circle cx="1025" cy="265" r="60" fill="url(#glow)"/><circle cx="1025" cy="265" r="11" fill="#d6a860"/><text x="944" y="365" fill="#ede3d3" font-size="24" font-family="sans-serif">足元を見る</text><text x="55" y="595" fill="#bba78e" font-size="17" font-family="sans-serif">配置の説明図です。商品の形・寸法・実際の明るさを示すものではありません。</text></svg>