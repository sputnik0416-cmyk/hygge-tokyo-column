<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title"><title id="title">横に置く、奥を見る、手元と足元を確認する3手順</title><defs><radialGradient id="halo"><stop stop-color="#D6A860" stop-opacity=".55"/><stop offset="1" stop-color="#D6A860" stop-opacity="0"/></radialGradient></defs><rect width="1200" height="900" fill="#17110D"/><text x="65" y="95" fill="#EDE3D3" font-size="54" font-weight="700" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">迷ったら、この順番だけ</text><rect x="65" y="170" width="1070" height="170" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><circle cx="155" cy="255" r="70" fill="url(#halo)"/><circle cx="155" cy="255" r="30" fill="#D6A860" stroke="#EDE3D3" stroke-width="3"/><text x="142" y="270" fill="#17110D" font-size="42" font-weight="700" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">1</text><text x="235" y="242" fill="#EDE3D3" font-size="46" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">座る場所の横に置く</text><text x="235" y="305" fill="#C4B29A" font-size="36" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">まずは手持ちのランプで。</text><path d="M600 351 V378 M589 367 L600 378 L611 367" fill="none" stroke="#D6A860" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="390" width="1070" height="170" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><circle cx="155" cy="475" r="70" fill="url(#halo)"/><circle cx="155" cy="475" r="30" fill="#D6A860" stroke="#EDE3D3" stroke-width="3"/><text x="142" y="490" fill="#17110D" font-size="42" font-weight="700" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">2</text><text x="235" y="462" fill="#EDE3D3" font-size="46" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">奥が暗ければ、棚にも置く</text><text x="235" y="525" fill="#C4B29A" font-size="36" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">明るさが足りていれば追加しない。</text><path d="M600 571 V598 M589 587 L600 598 L611 587" fill="none" stroke="#D6A860" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="65" y="610" width="1070" height="170" rx="20" fill="#221913" stroke="#71583F" stroke-width="3"/><circle cx="155" cy="695" r="70" fill="url(#halo)"/><circle cx="155" cy="695" r="30" fill="#D6A860" stroke="#EDE3D3" stroke-width="3"/><text x="142" y="710" fill="#17110D" font-size="42" font-weight="700" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">3</text><text x="235" y="682" fill="#EDE3D3" font-size="46" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">手元と足元を確かめる</text><text x="235" y="745" fill="#C4B29A" font-size="36" font-weight="500" font-family="Hiragino Kaku Gothic ProN,Yu Gothic,sans-serif">暗ければ天井の照明も使う。</text></svg>